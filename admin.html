<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ — ОКЕАН-кафе</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=Manrope:wght@400;700&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="ready">
<div class="gate" id="gate">
  <div class="card">
    <h1>ОКЕАН · Админ</h1>
    <input class="field" id="pw" type="password" placeholder="Сырсөз" autocomplete="current-password" autofocus>
    <div class="err" id="err"></div>
    <button class="btn" id="login" type="button">Кирүү</button>
    <a href="index.html" style="color:var(--mist)">Сайтка кайтуу</a>
  </div>
</div>

<div id="panel" hidden>
  <header class="top"><div class="wrap">
    <span class="brand">ОКЕАН<b>·</b>админ</span>
    <span><a class="btn ghost sm" href="index.html">Сайтты көрүү</a> <button class="btn ghost sm" id="logout" type="button">Чыгуу</button></span>
  </div></header>
  <main class="wrap admin">
    <form class="card form" id="form">
      <h2 id="ftitle">Жаңы тамак</h2>
      <label class="drop" id="drop" for="file"><span id="dtxt">Сүрөттү тандоо үчүн басыңыз</span></label>
      <input type="file" id="file" accept="image/*" hidden>
      <input class="field" id="name" placeholder="Тамактын аты" required>
      <input class="field" id="category" placeholder="Бөлүм (мисалы: Салаттар)" list="catlist" required>
      <datalist id="catlist"></datalist>
      <input class="field" id="price" type="number" min="0" placeholder="Баасы (сом)" required>
      <textarea class="field" id="desc" placeholder="Кыскача сүрөттөмө"></textarea>
      <button class="btn" type="submit" id="saveBtn">Тамакты сактоо</button>
      <button class="btn ghost" type="button" id="cancel" hidden>Жокко чыгаруу</button>
    </form>
    <section><div class="alist" id="alist"></div></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
